# Cut a release tag from CI (tags are cut by CI, never pushed by hand).
# Go modules need nothing beyond the tag — the module proxy serves it on demand.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "semver tag to cut at main HEAD, e.g. v0.4.0"
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit-test
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUDIT_TEST_DATABASE_URL: postgres://audit:audit-test@localhost:5432/audit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The tag is the release artifact for a Go module, so gate it on the
      # same tests CI runs.
      - run: go build ./... && go vet ./... && go test -race ./...

      - name: Validate and cut tag
        run: |
          V="${{ github.event.inputs.version }}"
          if ! echo "$V" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a vX.Y.Z semver: $V"; exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$V" | grep -q .; then
            echo "::error::tag $V already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$V"
          git push origin "$V"
